name: GigaAM check (temporary, branch only)
on:
  push:
    branches: [claude/project-thread-3n7v8s]
permissions:
  contents: read
concurrency:
  group: gigaam-${{ github.ref }}
  cancel-in-progress: true
env:
  REV: 9488b39159c6d30f0fbaef1e41459f1e078daf30
  REPO: al-bo/gigaam-v3-e2e-rnnt-mlx
jobs:
  inference:
    name: Real GigaAM v3 inference on Russian speech
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VECTA_DEPENDENCY_CACHE: ${{ github.workspace }}/.build/dependency-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build/dependency-cache
          key: source-repositories-${{ runner.os }}-${{ runner.arch }}-xcode26.4.1-${{ hashFiles('Package.resolved', 'AI/MLX/Package.resolved') }}
      - name: Download pinned model (runner temp only) and record hashes
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/gigaam"; mkdir -p "$M"
          for f in config.json model.safetensors; do
            curl -fsSL --retry 4 -o "$M/$f" "https://huggingface.co/$REPO/resolve/$REV/$f"
            printf '%s %s %s\n' "$f" "$(shasum -a 256 "$M/$f" | cut -d' ' -f1)" "$(stat -f %z "$M/$f")" | tee -a "$RUNNER_TEMP/hashes.txt"
          done
          { echo '### Model files'; echo '```'; cat "$RUNNER_TEMP/hashes.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build workers
        run: python3 -I Tools/build-workers.py
      - name: Russian samples
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/samples"; mkdir -p "$S"
          curl -fsSL --retry 4 -o "$S/example.wav" https://github.com/salute-developers/GigaAM/raw/main/example.wav || true
          voice="$(say -v '?' | awk '/ru_RU/{print $1; exit}')"
          if [ -n "$voice" ]; then
            say -v "$voice" -o "$S/say.aiff" "Привет! Это проверка распознавания русской речи. Сегодня двадцать третье октября, и мы тестируем новую модель."
            afconvert -f WAVE -d LEF32@16000 -c 1 "$S/say.aiff" "$S/say.wav"; rm "$S/say.aiff"
          fi
          ls -la "$S"
      - name: Recognize with VectaMLX --gigaam-speech
        run: |
          set -euo pipefail
          MLX="$(python3 -I -c 'import json;print(json.load(open(".build/worker-build.json"))["mlxDerivedData"])')/Build/Products/Release/VectaMLX"
          for audio in "$RUNNER_TEMP"/samples/*.wav; do
            name="$(basename "$audio" .wav)"; work="$RUNNER_TEMP/run-$name"; mkdir -p "$work"
            digest="$(shasum -a 256 "$audio" | cut -d' ' -f1)"
            printf '{"mode":"gigaam_speech","audio":"%s","checkpoint":"%s/checkpoint.json","digest":"%s","checkpoint_version":1,"decoding_policy":"gigaam-v3-e2e-rnnt-v1","chunk_seconds":20,"overlap_seconds":2}' "$audio" "$work" "$digest" > "$work/in.json"
            start=$(date +%s)
            "$MLX" --gigaam-speech "$RUNNER_TEMP/gigaam" "$work/events.json" < "$work/in.json" > "$work/out.json"
            end=$(date +%s)
            python3 -I - "$work" "$name" "$((end-start))" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          work, name, wall = sys.argv[1:]
          c = json.load(open(work + "/checkpoint.json"))
          print(f"### {name}: {c['duration']:.1f}s audio, wall {wall}s, decode {c['seconds']:.2f}s, completed {c['completed']}")
          print("Text: " + "".join(w["text"] for w in c["words"]).strip())
          print("First words: " + ", ".join(f"{w['text'].strip()}@{w['start']:.2f}-{w['end']:.2f}" for w in c["words"][:8]))
          print("Summary: " + open(work + "/out.json").read())
          PY
          done
  release:
    name: Build 80 release (registry pinned in-job)
    runs-on: macos-26
    timeout-minutes: 120
    env:
      VECTA_DEPENDENCY_CACHE: ${{ github.workspace }}/.build/dependency-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          python3 -I Tools/release.py doctor
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build/dependency-cache
          key: source-repositories-${{ runner.os }}-${{ runner.arch }}-xcode26.4.1-${{ hashFiles('Package.resolved', 'AI/MLX/Package.resolved') }}
      - name: Pin GigaAM config hash into the registry (local tree only)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/config.json" "https://huggingface.co/$REPO/resolve/$REV/config.json"
          sha="$(shasum -a 256 "$RUNNER_TEMP/config.json" | cut -d' ' -f1)"; size="$(stat -f %z "$RUNNER_TEMP/config.json")"
          echo "config.json $sha $size" >> "$GITHUB_STEP_SUMMARY"
          python3 -I - "$sha" "$size" <<'PY'
          import json, sys
          sha, size = sys.argv[1], int(sys.argv[2])
          rev = "9488b39159c6d30f0fbaef1e41459f1e078daf30"; repo = "al-bo/gigaam-v3-e2e-rnnt-mlx"
          base = f"https://huggingface.co/{repo}/resolve/{rev}/"
          entry = {"id": "gigaam", "title": "GigaAM v3 · E2E RNN-T", "variant": "MLX · FP16", "repository": repo, "revision": rev, "license": "MIT",
                   "files": [{"name": "config.json", "url": base + "config.json", "sha256": sha, "size": size},
                             {"name": "model.safetensors", "url": base + "model.safetensors", "sha256": "54295fab7b860459949fd16f1481cd67202680ef76d54020591a849026bc2515", "size": 445099810}],
                   "backend": "mlx"}
          for p in ["AI/Resources/models.json", "AI/Resources/models-mlx.json"]:
              d = json.load(open(p))
              d["models"] = [m for m in d["models"] if m["id"] != "gigaam"]
              d["models"].insert([m["id"] for m in d["models"]].index("tokenizer") + 1, entry)
              open(p, "w").write(json.dumps(d, indent=2, ensure_ascii=False) + "\n")
          PY
          git rm -q .github/workflows/gigaam-check.yml
          git -c user.name=ci -c user.email=ci@localhost commit -qam "CI-local registry pin"
      - name: Release build 80 (checks, workers, app, heavy tests, verify, DMG)
        run: python3 -I Tools/release.py build .build/b80 --version 0.1.0 --build 80
      - name: DMG checksum
        if: always()
        run: |
          ls -la .build/b80/artifacts || true
          (cd .build/b80/artifacts 2>/dev/null && shasum -a 256 ./* | tee -a "$GITHUB_STEP_SUMMARY") || true
      - name: Keep build 80 as a private Actions artifact (not a Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Vecta-0.1.0-build80
          path: .build/b80/artifacts/
          if-no-files-found: error
          retention-days: 14
