name: GigaAM check (temporary, branch only)
on:
  push:
    branches: [claude/project-thread-3n7v8s]
permissions:
  contents: read
concurrency:
  group: gigaam-${{ github.ref }}
  cancel-in-progress: true
env:
  REV: 9488b39159c6d30f0fbaef1e41459f1e078daf30
  REPO: al-bo/gigaam-v3-e2e-rnnt-mlx
jobs:
  inference:
    name: Real GigaAM v3 inference on Russian speech
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VECTA_DEPENDENCY_CACHE: ${{ github.workspace }}/.build/dependency-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build/dependency-cache
          key: source-repositories-${{ runner.os }}-${{ runner.arch }}-xcode26.4.1-${{ hashFiles('Package.resolved', 'AI/MLX/Package.resolved') }}
      - name: Download pinned model (runner temp only) and record hashes
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/gigaam"; mkdir -p "$M"
          for f in config.json model.safetensors; do
            curl -fsSL --retry 4 -o "$M/$f" "https://huggingface.co/$REPO/resolve/$REV/$f"
            printf '%s %s %s\n' "$f" "$(shasum -a 256 "$M/$f" | cut -d' ' -f1)" "$(stat -f %z "$M/$f")" | tee -a "$RUNNER_TEMP/hashes.txt"
          done
          { echo '### Model files'; echo '```'; cat "$RUNNER_TEMP/hashes.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build workers
        run: python3 -I Tools/build-workers.py
      - name: Russian samples (one voice, and a two-voice dialogue over several windows)
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/samples"; mkdir -p "$S" "$RUNNER_TEMP/parts"
          say -v '?' | grep -i 'ru_RU' || true
          voices=($(say -v '?' | awk '/ru_RU/{print $1}'))
          echo "Russian voices: ${voices[*]:-none}" >> "$GITHUB_STEP_SUMMARY"
          a="${voices[0]}"; b="${voices[1]:-${voices[0]}}"
          say -v "$a" -o "$RUNNER_TEMP/parts/say.aiff" "Привет! Это проверка распознавания русской речи. Сегодня двадцать третье октября, и мы тестируем новую модель."
          afconvert -f WAVE -d LEI16@16000 -c 1 "$RUNNER_TEMP/parts/say.aiff" "$S/say.wav"
          lines=(
            "$a|Добрый день, коллеги. Давайте начнём наше совещание по запуску нового продукта."
            "$b|Здравствуйте. У меня есть несколько вопросов по срокам и бюджету проекта."
            "$a|Хорошо, сначала обсудим сроки. Мы планируем выпустить версию в декабре."
            "$b|Декабрь звучит реалистично, но тестирование займёт не меньше трёх недель."
            "$a|Согласен. Тогда предлагаю начать тестирование уже в середине ноября."
            "$b|Отлично, я подготовлю план и отправлю его всем до пятницы."
          )
          i=0; files=()
          for line in "${lines[@]}"; do
            v="${line%%|*}"; t="${line#*|}"
            say -v "$v" -o "$RUNNER_TEMP/parts/$i.aiff" "$t"
            afconvert -f WAVE -d LEI16@16000 -c 1 "$RUNNER_TEMP/parts/$i.aiff" "$RUNNER_TEMP/parts/$i.wav"
            files+=("$RUNNER_TEMP/parts/$i.wav"); i=$((i+1))
          done
          python3 -I - "$S/dialogue.wav" "${files[@]}" <<'PY'
          import sys, wave
          out = wave.open(sys.argv[1], "wb"); out.setnchannels(1); out.setsampwidth(2); out.setframerate(16000)
          for path in sys.argv[2:]:
              w = wave.open(path, "rb"); out.writeframes(w.readframes(w.getnframes())); out.writeframes(b"\0\0" * 12000)
          out.close()
          PY
          ls -la "$S"
      - name: Recognize with VectaMLX --gigaam-speech
        run: |
          set -euo pipefail
          MLX="$(python3 -I -c 'import json;print(json.load(open(".build/worker-build.json"))["mlxDerivedData"])')/Build/Products/Release/VectaMLX"
          for audio in "$RUNNER_TEMP"/samples/*.wav; do
            name="$(basename "$audio" .wav)"; work="$RUNNER_TEMP/run-$name"; mkdir -p "$work"
            digest="$(shasum -a 256 "$audio" | cut -d' ' -f1)"
            printf '{"mode":"gigaam_speech","audio":"%s","checkpoint":"%s/speech-gigaam-v3-ru-%s.json","digest":"%s","checkpoint_version":1,"decoding_policy":"gigaam-v3-e2e-rnnt-v1","chunk_seconds":20,"overlap_seconds":2}' "$audio" "$work" "$digest" "$digest" > "$work/in.json"
            start=$(date +%s)
            "$MLX" --gigaam-speech "$RUNNER_TEMP/gigaam" "$work/events.json" < "$work/in.json" > "$work/out.json"
            end=$(date +%s)
            python3 -I - "$work/speech-gigaam-v3-ru-$digest.json" "$name" "$((end-start))" "$work/out.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          path, name, wall, out = sys.argv[1:]
          c = json.load(open(path))
          print(f"### {name}: {c['duration']:.1f}s audio, wall {wall}s, decode {c['seconds']:.2f}s, completed {c['completed']}")
          print("Text: " + "".join(w["text"] for w in c["words"]).strip())
          print("First words: " + ", ".join(f"{w['text'].strip()}@{w['start']:.2f}-{w['end']:.2f}" for w in c["words"][:8]))
          print("Summary: " + open(out).read())
          PY
          done
      - name: Download pinned SpeakerKit files (runner temp only)
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/speaker" <<'PY'
          import hashlib, json, os, sys, urllib.request
          root = sys.argv[1]
          model = [m for m in json.load(open("AI/Resources/models-mlx.json"))["models"] if m["id"] == "speaker"][0]
          for f in model["files"]:
              target = os.path.join(root, f["name"]); os.makedirs(os.path.dirname(target), exist_ok=True)
              data = urllib.request.urlopen(f["url"]).read()
              assert len(data) == f["size"] and hashlib.sha256(data).hexdigest() == f["sha256"], f["name"]
              open(target, "wb").write(data)
          print("speaker files", len(model["files"]))
          PY
      - name: Diarization and transcript assembly via VectaSpeech (GigaAM checkpoint)
        run: |
          set -euo pipefail
          SPEECH="$(python3 -I -c 'import json;print(json.load(open(".build/worker-build.json"))["speechBuild"])')/release/VectaSpeech"
          audio="$RUNNER_TEMP/samples/dialogue.wav"; work="$RUNNER_TEMP/run-dialogue"
          digest="$(shasum -a 256 "$audio" | cut -d' ' -f1)"
          python3 -I - "$work/request.json" "$digest" <<'PY'
          import json, sys, uuid
          json.dump({"version": 1, "id": str(uuid.uuid4()).upper(), "recordingID": "ci-dialogue", "audioFilename": "dialogue.wav",
                     "audioSHA256": sys.argv[2], "provider": "local",
                     "format": {"id": "custom_" + str(uuid.uuid4()).lower(), "title": "CI", "prompt": "CI", "revision": 1},
                     "createdAt": 0, "summaryOnly": False, "speechEngine": "gigaam"}, open(sys.argv[1], "w"))
          PY
          "$SPEECH" "$work/request.json" "$audio" "" "$RUNNER_TEMP/speaker" "" "$work/result.json"
          python3 -I - "$work/result.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(f"### Diarized dialogue: stage {r.get('stage')}, error {r.get('error')}")
          for s in r.get("segments", []):
              print(f"- {s.get('speaker', s.get('speakerID'))} [{s.get('start', 0):.1f}-{s.get('end', 0):.1f}] {s.get('text')}")
          PY
  release:
    name: Build 80 release (registry pinned in-job)
    runs-on: macos-26
    timeout-minutes: 120
    env:
      VECTA_DEPENDENCY_CACHE: ${{ github.workspace }}/.build/dependency-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          python3 -I Tools/release.py doctor
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build/dependency-cache
          key: source-repositories-${{ runner.os }}-${{ runner.arch }}-xcode26.4.1-${{ hashFiles('Package.resolved', 'AI/MLX/Package.resolved') }}
      - name: Pin GigaAM config hash into the registry (local tree only)
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/config.json" "https://huggingface.co/$REPO/resolve/$REV/config.json"
          sha="$(shasum -a 256 "$RUNNER_TEMP/config.json" | cut -d' ' -f1)"; size="$(stat -f %z "$RUNNER_TEMP/config.json")"
          echo "config.json $sha $size" >> "$GITHUB_STEP_SUMMARY"
          python3 -I - "$sha" "$size" <<'PY'
          import json, sys
          sha, size = sys.argv[1], int(sys.argv[2])
          rev = "9488b39159c6d30f0fbaef1e41459f1e078daf30"; repo = "al-bo/gigaam-v3-e2e-rnnt-mlx"
          base = f"https://huggingface.co/{repo}/resolve/{rev}/"
          entry = {"id": "gigaam", "title": "GigaAM v3 · E2E RNN-T", "variant": "MLX · FP16", "repository": repo, "revision": rev, "license": "MIT",
                   "files": [{"name": "config.json", "url": base + "config.json", "sha256": sha, "size": size},
                             {"name": "model.safetensors", "url": base + "model.safetensors", "sha256": "54295fab7b860459949fd16f1481cd67202680ef76d54020591a849026bc2515", "size": 445099810}],
                   "backend": "mlx"}
          for p in ["AI/Resources/models.json", "AI/Resources/models-mlx.json"]:
              d = json.load(open(p))
              d["models"] = [m for m in d["models"] if m["id"] != "gigaam"]
              d["models"].insert([m["id"] for m in d["models"]].index("tokenizer") + 1, entry)
              open(p, "w").write(json.dumps(d, indent=2, ensure_ascii=False) + "\n")
          PY
          git rm -q .github/workflows/gigaam-check.yml
          git -c user.name=ci -c user.email=ci@localhost commit -qam "CI-local registry pin"
      - name: Release build 80 (checks, workers, app, heavy tests, verify, DMG)
        run: python3 -I Tools/release.py build .build/b80 --version 0.1.0 --build 80
      - name: DMG checksum
        if: always()
        run: |
          ls -la .build/b80/artifacts || true
          (cd .build/b80/artifacts 2>/dev/null && shasum -a 256 ./* | tee -a "$GITHUB_STEP_SUMMARY") || true
      - name: Keep build 80 as a private Actions artifact (not a Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Vecta-0.1.0-build80
          path: .build/b80/artifacts/
          if-no-files-found: error
          retention-days: 14
