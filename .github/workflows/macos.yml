name: macOS
on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-security:
    name: Source / secrets / workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Public allowlist and privacy/integrity regressions
        run: |
          python3 -I Tools/check-public-tree.py
          python3 -I Tools/test-packaging.py
      - name: Validate Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Secret scan (redacted; source and Git history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.3 detect --source . --redact --no-banner --exit-code 1
  model-free:
    name: Model-free macOS regressions
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select full Xcode and validate ARM64 toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          python3 -I Tools/release.py doctor --model-free
      - name: Core / UI-state / voices / localization / prompts / local-AI / legacy
        run: python3 -I Tools/release.py check
      - name: Native transport and actual codecs
        run: |
          bash Packages/VectaTransport/build-native-codecs.sh
          swift test --package-path Packages/VectaTransport --jobs 3
      - name: Physical hardware is a separate acceptance gate
        run: printf '%s\n' 'NOT TESTED — no physical PLAUD is attached. Synthetic transport PASS is not physical BLE/Wi-Fi acceptance.' >> "$GITHUB_STEP_SUMMARY"
  full-build:
    name: Full ARM64 Speech MLX app package
    needs: [source-security, model-free]
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VECTA_DEPENDENCY_CACHE: ${{ github.workspace }}/.build/dependency-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          python3 -I Tools/release.py doctor
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build/dependency-cache
          key: source-repositories-${{ runner.os }}-${{ runner.arch }}-xcode26.4.1-${{ hashFiles('Package.resolved', 'AI/MLX/Package.resolved') }}
      - name: Build workers, app, tests, relink kit and DMG without models
        run: python3 -I Tools/release.py build .build/ci-release --version 0.1.0 --build 78
      - name: Record acceptance boundaries
        run: printf '%s\n' 'PASS local source/bundle/DMG checks if preceding steps passed. NOT TESTED — real model inference, physical recorder, clean-user Gatekeeper. No model weights downloaded; no publication.' >> "$GITHUB_STEP_SUMMARY"
